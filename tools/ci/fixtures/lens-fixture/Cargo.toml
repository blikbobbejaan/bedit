[package]
name = "lens-fixture"
version = "0.1.0"
edition = "2021"

# The crate tools/ci/lsp-rust.blsp opens under rust-analyzer: inlay hints (an inferred type,
# parameter names), semantic tokens (a definition, a call, a parameter) and code lenses (Run on
# `main`, Run Test on a test, N implementations on a struct). Copied to a temporary folder
# before it is opened, so rust-analyzer's and cargo's files never land in the checkout.

name: CI

# Thin caller. The gate itself — build brood, `nest check`, `nest format --check`,
# `nest test` — lives once in broodlang/brood/.github/workflows/package-ci.yml, so a
# change to what "green" means is one edit rather than one per repo.
#
# It tracks brood `main` on purpose: a package pinned by git ref with no CI is a package
# whose breakage is found by whoever deploys it, which is how hatch stayed broken across
# two releases.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The weekly full run: the same jobs plus what per push leaves out to stay quick (the
  # whole-project checker on macOS and Windows, PLATFORM_CHECK below). Sunday 04:00 UTC,
  # after brood's own full run.
  schedule:
    - cron: "0 4 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: broodlang/brood/.github/workflows/package-ci.yml@main
    with:
      # The suite is ~4 minutes in one job; four shards side by side keep each under two
      # (brood's package-ci, `nest test --partitions 4 --shard K`; three left one at 3 minutes).
      test-partitions: 4

  # macOS and Windows: the OSes bedit's design claims to avoid Emacs's per-platform bugs on
  # (paths, CRLF, the clipboard, keys, fonts, spawning, home directories), which the gate
  # above — Linux only — never runs on. A `nest` built from brood for THAT OS, with the gui,
  # runs the boot check and the platform smoke set (and `nest check`, in the weekly run)
  # (tools/ci/platform-smoke.sh says what each file is there for). Built rather than
  # downloaded: brood's CI keeps no nest per OS, and the target directory is cached here, so
  # a run after the first rebuilds only what brood changed.
  platform-smoke:
    name: platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      # The brood built against: `main`, as the gate above tracks it.
      BROOD_REF: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: broodlang/brood
          ref: ${{ env.BROOD_REF }}
          path: .brood
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .brood
          cache-on-failure: true
      - name: Build nest with the gui
        working-directory: .brood
        run: cargo build -p nest --features brood/gui --features brood/treesit-grammars
      - name: the boot check and the platform smoke set (headless; nest check weekly)
        shell: bash
        env:
          PLATFORM_CHECK: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: bash tools/ci/platform-smoke.sh .brood/target/debug/nest
      # The step above runs under Git Bash, which sets HOME and puts `sh` on PATH — neither
      # of which a Windows desktop launch has. Here: PowerShell, HOME unset (so the home is
      # USERPROFILE's) and Git's `sh` off PATH, over the files that spawn a shell, resolve
      # the home or write under it.
      - name: Windows as a desktop launch has it (pwsh, no HOME, no sh)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BROOD_GUI_HEADLESS: "1"
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\(usr\\)?bin' -and $_ -notmatch '\\(msys64|mingw64)' }) -join ';'
          if ($env:HOME) { throw "HOME is still set: $env:HOME" }
          $sh = Get-Command sh -ErrorAction SilentlyContinue
          if ($sh) { throw "sh is still on PATH: $($sh.Source)" }
          $env:BSHELL_HISTORY = Join-Path $env:RUNNER_TEMP 'bshell-history.blsp'
          $nest = Resolve-Path .brood/target/debug/nest.exe
          & $nest run --check-boot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $nest test tests/shell_command_test.blsp tests/bshell_test.blsp tests/compile_test.blsp tests/platform_test.blsp tests/recover_test.blsp tests/startup_test.blsp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
